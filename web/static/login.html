<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · Agnes AI 制片工坊</title>
<style>
  :root{--bg:#eceef2;--panel:#ffffff;--border:#e2e6ec;--text:#1f2430;--muted:#697081;--accent:#d9701f;--accent2:#f39c12;--err:#d6453c}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);
       display:flex;align-items:center;justify-content:center;min-height:100vh;
       background-image:radial-gradient(circle at 50% 16%,rgba(217,112,31,.10),transparent 55%),radial-gradient(#d4d9e1 1px,transparent 1px);background-size:100% 100%,24px 24px}
  .card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:38px 32px 30px;width:340px;
        box-shadow:0 18px 50px -12px rgba(30,40,60,.18),0 2px 8px rgba(30,40,60,.06);text-align:center;animation:fadein .5s ease both;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent))}
  .card.shake{animation:shake .45s}
  .logo{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:1px}.logo b{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  input{width:100%;background:#f3f5f8;color:var(--text);border:1px solid var(--border);border-radius:10px;
        padding:12px;font-size:14px;text-align:center;font-family:inherit;letter-spacing:2px;transition:border-color .2s,box-shadow .2s,transform .2s}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 6px 18px -8px rgba(217,112,31,.5);transform:translateY(-1px)}
  button{width:100%;margin-top:14px;color:#fff;border:0;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:inherit;
         background:linear-gradient(90deg,var(--accent),var(--accent2));background-size:160% 100%;background-position:0 0;
         transition:background-position .4s,filter .15s,transform .1s;box-shadow:0 8px 20px -8px rgba(217,112,31,.6)}
  button:hover{background-position:100% 0;filter:brightness(1.05)}
  button:active{transform:scale(.98)}
  .err{color:var(--err);font-size:12px;margin-top:10px;min-height:16px}
  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Agnes<b> · AI 制片工坊</b></div>
    <div class="sub">AI 短片一站式制作 · 请输入访问密码</div>
    <form id="f">
      <input type="password" id="pwd" placeholder="访问密码" autofocus />
      <button type="submit">进 入</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pwd').value})
    });
    const d = await r.json();
    if (r.ok && d.ok) { window.location.reload(); }
    else { errEl.textContent = d.detail || '密码错误'; shakeCard(); }
  } catch (ex) { errEl.textContent = '网络错误'; shakeCard(); }
};
function shakeCard(){const c=document.querySelector('.card');if(!c)return;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
</script>
</body>
</html>
