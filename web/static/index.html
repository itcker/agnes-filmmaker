<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agnes · AI 制片工坊</title>
<style>
  :root{--bg:#eceef2;--panel:#ffffff;--panel2:#f3f5f8;--border:#e2e6ec;--text:#1f2430;--muted:#697081;--accent:#d9701f;--ok:#1aa260;--run:#2f7fd0;--err:#d6453c}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  a{color:var(--accent);text-decoration:none}
  header{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#ffffff,#f3f5f8)}
  header .logo{font-size:17px;font-weight:700}header .logo b{color:var(--accent)}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px}
  .badge.run{background:rgba(52,152,219,.2);color:var(--run)}.badge.ok{background:rgba(46,204,113,.18);color:var(--ok)}.badge.none{background:var(--panel2);color:var(--muted)}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.08)}button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}button.small{padding:5px 9px;font-size:12px}
  .body{display:flex;height:calc(100vh - 50px)}
  /* 左栏 */
  .sidebar{width:262px;flex-shrink:0;border-right:1px solid var(--border);overflow:auto;padding:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,40,60,.04)}
  .card h2{margin:0 0 10px;font-size:13px}
  textarea,input[type=text]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:13px;font-family:inherit;transition:border-color .18s,box-shadow .18s}
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,112,31,.12)}
  textarea{min-height:104px;line-height:1.65;resize:vertical}
  .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .muted{color:var(--muted);font-size:12px}
  .proj{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
  .proj:hover{border-color:var(--accent);box-shadow:0 4px 14px -6px rgba(217,112,31,.25);transform:translateY(-1px)}.proj.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .proj .t{font-weight:600;font-size:12px}.proj .d{color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  /* 画布 */
  .viewport{flex:1;position:relative;overflow:hidden;background:#e6e9ef;cursor:grab;background-image:radial-gradient(#d4d9e1 1px,transparent 1px);background-size:24px 24px}
  .viewport.panning{cursor:grabbing}
  .maincol{flex:1;display:flex;flex-direction:column;min-width:0}
  .ctrlbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;flex-shrink:0}
  .ctrlbar .livebar{flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:6px 12px;margin:0}
  .hide{display:none!important}
  .ctrlbar .zoom{display:flex;align-items:center;gap:5px}
  .lb-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px;gap:14px}
  .lb-row b{color:var(--accent)}
  .lb-prog{height:6px;background:var(--border);border-radius:4px;overflow:hidden}.lb-prog>div{height:100%;background:linear-gradient(90deg,var(--accent),#f39c12);width:0;transition:width .4s}
  .board{position:absolute;top:0;left:0;width:10px;height:10px;transform-origin:0 0}
  #links{position:absolute;left:0;top:0;width:8000px;height:6000px;overflow:visible;pointer-events:none;z-index:0}
  .n{z-index:1}
  /* 卡片 */
  .n{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(30,40,60,.12);display:flex;flex-direction:column}
  .n .chead{padding:7px 10px;font-size:12px;font-weight:600;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:grab;user-select:none;flex-shrink:0}
  .n .chead:active{cursor:grabbing}
  .n.film{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(217,112,31,.22)}.n.film .chead{color:var(--accent)}
  .n .cbody{padding:7px;overflow:auto;flex:1}
  .n video{display:block;width:100%;background:#000;border-radius:6px}
  .n img{display:block;width:100%;border-radius:6px;cursor:zoom-in;object-fit:cover}
  .n pre{white-space:pre-wrap;word-break:break-word;font-size:11px;line-height:1.5;color:var(--muted);margin:0}
  .n .tag{font-size:10px;color:var(--muted)}
  .n[data-kind="v"] video{height:148px}.n.film video{height:206px}.n[data-kind="i"] img{height:120px}
  .zone{position:absolute;font-size:13px;font-weight:700;color:var(--text);letter-spacing:.5px;padding:6px 12px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel);box-shadow:0 2px 6px rgba(30,40,60,.08);z-index:0;pointer-events:none;text-align:left;white-space:nowrap;overflow:hidden}
  .empty-full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(720px,92vw);max-height:84vh;overflow:auto}
  .modal pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;margin:0}

  /* === 增量样式：制作控制抽屉 / Gate Review / 时间线（不覆盖现有选择器）=== */
  button{transition:filter .15s,transform .1s,box-shadow .15s}
  button:active{transform:scale(.97)}
  /* 制作控制抽屉 */
  .drawer{position:fixed;top:0;right:0;width:348px;height:100vh;background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(30,40,60,.1);z-index:40;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer .dhead{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fff,#f3f5f8)}
  .drawer .dhead b{font-size:14px}.drawer .dbody{flex:1;overflow:auto;padding:10px 12px}
  .stg{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px;transition:border-color .15s,box-shadow .15s}
  .stg:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(217,112,31,.10)}
  .stg.cur{border-color:var(--accent);background:#fff7f0}
  .stg .stitle{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
  .stg .sops{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .stg .sops button{padding:4px 8px;font-size:11px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#cfd5de;vertical-align:middle}
  .dot.working{background:var(--accent);animation:pulse 1.1s infinite}
  .dot.done{background:var(--ok)}.dot.error{background:var(--err)}
  .stag-dots{display:inline-flex;gap:3px;margin-left:auto;align-items:center}
  .pill{font-size:10px;padding:1px 7px;border-radius:8px;background:#fff;color:var(--muted);border:1px solid var(--border)}
  .pill.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pill.done{background:rgba(26,162,96,.12);color:var(--ok);border-color:transparent}
  /* Gate Review 弹窗 */
  .gr-modal{position:fixed;inset:0;background:rgba(20,24,32,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:55}
  .gr-modal.show{display:flex;animation:fadein .2s}
  .gr-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:min(820px,94vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(20,30,50,.35);animation:popin .22s}
  .gr-bar{height:3px;background:linear-gradient(90deg,var(--accent),var(--err),var(--accent))}
  .gr-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .gr-head b{font-size:14px}
  .gr-body{padding:14px 18px;overflow:auto;flex:1}
  .gr-verdict{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;margin-bottom:12px;font-size:13px;font-weight:600}
  .gr-verdict.pass{background:rgba(26,162,96,.10);color:var(--ok)}
  .gr-verdict.fail{background:rgba(214,69,60,.10);color:var(--err)}
  .gr-verdict.wait{background:var(--panel2);color:var(--muted)}
  .gr-sec{margin-bottom:13px}
  .gr-sec h4{margin:0 0 6px;font-size:12px;color:var(--muted)}
  .gr-issues{font-size:12px;line-height:1.7}
  .gr-out{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;color:var(--text)}
  .gr-diff{background:#0f1320;border-radius:9px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;max-height:220px;overflow:auto;color:#9aa3b2}
  .gr-diff .plus{color:#5dd9a1;background:rgba(46,204,113,.10)}
  .gr-diff .minus{color:#ff8b80;background:rgba(214,69,60,.12)}
  .gr-diff .meta{color:#6fb7ff}
  .gr-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center}
  .gr-foot input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:12px;font-family:inherit;color:var(--text)}
  .gr-loading{display:flex;align-items:center;justify-content:center;gap:9px;padding:40px;color:var(--muted);font-size:13px}
  .spin{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  /* 底部镜头时间线 */
  .timeline{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--border);backdrop-filter:blur(8px);z-index:30;transform:translateY(calc(100% - 30px));transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .timeline.open{transform:translateY(0)}
  .tl-head{height:30px;display:flex;align-items:center;gap:7px;padding:0 14px;cursor:pointer;font-size:11px;color:var(--muted);user-select:none}
  .tl-head:hover{color:var(--accent)}
  .tl-strip{display:flex;gap:8px;padding:4px 14px 12px;overflow-x:auto}
  .tl-item{flex-shrink:0;width:104px;cursor:pointer}
  .tl-thumb{position:relative;width:104px;height:60px;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--border);transition:border-color .15s,transform .12s}
  .tl-item:hover .tl-thumb{border-color:var(--accent);transform:translateY(-2px)}
  .tl-thumb img,.tl-thumb video{width:100%;height:100%;object-fit:cover}
  .tl-idx{position:absolute;top:2px;left:3px;font-size:9px;background:rgba(0,0,0,.55);color:#fff;padding:0 4px;border-radius:4px}
  .tl-cap{font-size:9px;color:var(--muted);margin-top:3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 大图预览 */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;padding:32px}
  .lightbox.show{display:flex;animation:fadein .2s}
  .lightbox img,.lightbox video{max-width:100%;max-height:100%;border-radius:8px}
  .lightbox .x{position:absolute;top:18px;right:22px;color:#fff;font-size:18px;cursor:pointer;background:rgba(255,255,255,.12);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,112,31,.4)}100%{box-shadow:0 0 0 5px rgba(217,112,31,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes popin{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--text);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:70;box-shadow:0 10px 30px rgba(20,30,50,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:80vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="logo">Agnes<b> · AI 制片工坊</b></div>
  <div class="sub">把产物摊在画布上，自由拖动 · 平移空白处 · 滚轮缩放</div>
  <div class="spacer"></div>
  <span class="badge none" id="hBadge">未选项目</span>
</header>
<div class="body">
  <div class="sidebar">
    <div class="card">
      <h2>🎬 新建短片</h2>
      <textarea id="idea" placeholder="一句话想法…"></textarea>
      <div class="row"><input type="text" id="name" placeholder="项目名（可选）" style="flex:1"/><button id="btnCreate">生成</button></div>
      <div class="row"><label class="muted"><input type="checkbox" id="noMedia"/> 仅文本</label></div>
    </div>
    <div class="card"><h2>📁 项目</h2><div id="dList"></div></div>
    <div class="muted" style="padding:4px 2px">提示：选中项目后，产物会自动铺到画布上。拖卡片头移动；拖空白处平移；滚轮缩放。</div>
  </div>

  <div class="maincol">
    <div class="ctrlbar">
      <button id="btnRun" class="ghost small">▶ 运行全流程</button>
      <button id="btnMfg" class="ghost small">🛠 制作控制</button>
      <button class="ghost small" onclick="arrange()">⊞ 自动排列</button>
      <button class="ghost small" onclick="resetView()">⤢ 重置视图</button>
      <div class="livebar hide" id="liveBar">
        <div class="lb-row"><b id="lbStage">运行中</b><span id="lbCount" class="muted"></span></div>
        <div class="lb-prog"><div id="lbFill"></div></div>
      </div>
      <span class="muted" id="runInfo"></span>
      <div class="zoom">
        <button class="ghost small" onclick="setZoom(zoom*1.2)">＋</button>
        <span class="muted" id="zoomVal" style="font-size:11px;min-width:34px;text-align:center">70%</span>
        <button class="ghost small" onclick="setZoom(zoom/1.2)">－</button>
      </div>
    </div>
    <div class="viewport" id="viewport">
      <div class="board" id="board"><svg id="links" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="empty-full" id="emptyHint">👈 在左侧新建或点开一个项目，产物会铺到这块画布上</div>
    </div>
  </div>
</div>

<div class="modal" id="modal" style="display:none">
  <div class="box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b id="mTitle"></b><button class="ghost small" onclick="document.getElementById('modal').style.display='none'">关闭</button></div><pre id="mBody"></pre></div>
</div>

<!-- 增量：制作控制抽屉 -->
<aside class="drawer" id="drawer">
  <div class="dhead"><b>🛠 制作控制 · <span id="drwName">未选项目</span></b><button class="ghost small" onclick="toggleDrawer(false)">关闭</button></div>
  <div class="dbody" id="drwBody"><div class="muted" style="padding:20px;text-align:center">选中项目后显示阶段</div></div>
</aside>

<!-- 增量：Gate Review 弹窗 -->
<div class="gr-modal" id="grModal">
  <div class="gr-box">
    <div class="gr-bar"></div>
    <div class="gr-head"><b id="grTitle">Gate Review</b><button class="ghost small" onclick="closeGR()">关闭</button></div>
    <div class="gr-body" id="grBody"></div>
    <div class="gr-foot" id="grFoot" style="display:none">
      <input id="grReason" placeholder="打回原因（可选）"/>
      <button class="ghost small" onclick="grDoReject()">↩ 打回重做</button>
      <button class="small" style="background:var(--ok)" onclick="grDoApprove()">✓ 批准通过</button>
    </div>
  </div>
</div>

<!-- 增量：底部镜头时间线 -->
<div class="timeline" id="timeline">
  <div class="tl-head" onclick="toggleTimeline()"><span>🎞</span><span>镜头时间线</span><span id="tlCount"></span><span style="margin-left:auto" id="tlToggle">展开 ▲</span></div>
  <div class="tl-strip" id="tlStrip"></div>
</div>

<!-- 增量：大图预览 -->
<div class="lightbox" id="lightbox"><span class="x" onclick="closeLightbox()">✕</span><div id="lbContent"></div></div>

<script>
const $=id=>document.getElementById(id);const enc=encodeURIComponent;
const api=async(p,o)=>{const r=await fetch(p,o);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r.json()};
let currentId=null,es=null,zoom=0.8,panX=24,panY=24,lastArts=null,liveTimer=null;
// 产物中文名映射
const CN_AGENT={director:'总导演',screenwriter:'编剧',dialogue_expert:'台词专家',art_director:'美术指导',cinematographer:'摄影指导',storyboarder:'分镜师',asset_builder:'资产构建师',video_renderer:'视频渲染师',sound_designer:'声音设计师',post_editor:'后期剪辑师',qa_reviewer:'质控评审'};
const CN_DOC={'script_draft.md':'剧本草稿','dialogue_diagnosis.md':'台词诊断','art_direction.md':'美术方案','shot_list.md':'镜头设计','storyboard.md':'分镜脚本','asset_manifest.md':'资产清单','video_render_plan.md':'视频方案','sound_design.md':'声音设计','compositing_plan.md':'后期合成方案','qa_review.md':'质控评审','director_decision.md':'导演决策'};
const cnAgent=a=>CN_AGENT[a]||a;
const cnDoc=f=>CN_DOC[f]||f.replace(/\.md$/,'');
const cnImg=name=>{const m=String(name).match(/^(characters|scenes|props)[_ -]+(.*)/i);const pre={characters:'角色',scenes:'场景',props:'道具'};return m?(pre[m[1].toLowerCase()]||'素材')+' · '+m[2].replace(/[_]/g,' ').trim():name.replace(/_/g,' ')};
// 流水线阶段逻辑顺序 + 资产分类排序
const STAGE_ORDER=['director','screenwriter','dialogue_expert','art_director','cinematographer','storyboarder','asset_builder','video_renderer','sound_designer','post_editor','qa_reviewer'];
const catRank=im=>{const n=String(im.name||'');return /characters/i.test(n)?0:/scenes/i.test(n)?1:/props/i.test(n)?2:3};
const STAGE_CN={init:'初始化',script:'剧本创作',dialogue_review:'台词诊断',art_direction:'美术定调',shot_design:'镜头设计',asset_build:'资产构建·出图',video_render:'视频渲染·出片',post_edit:'后期合成·拼接',qa_review:'质控评审',final:'最终交付'};

// ── 项目 ──
async function refreshList(){const data=await api('/api/projects');window.__plist=data.projects;
  const el=$('dList');if(!data.projects.length){el.innerHTML='<div class="muted">无项目</div>';return}
  el.innerHTML=data.projects.map(p=>`<div class="proj ${currentId===p.id?'active':''}" onclick="openProject('${p.id}')">
    <div style="flex:1;min-width:0"><div class="t">${p.name} ${p.has_film?'<span class="badge ok">片</span>':''} ${p.running?'<span class="badge run">中</span>':''}</div>
    <div class="d">${p.logline||''}</div></div>
    <button class="ghost small" onclick="event.stopPropagation();delProject('${p.id}','${p.name.replace(/'/g,'')}')">✕</button></div>`).join('')}
let _lastIdea=null,_lastPid=null;
function toast(msg){let t=$('toastEl');if(!t){t=document.createElement('div');t.id='toastEl';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastT);window.__toastT=setTimeout(()=>t.classList.remove('show'),2400)}
$('btnCreate').onclick=async()=>{
  const idea=$('idea').value.trim();
  if(!idea){toast('请输入一句话想法');return}
  // 防重复：同一句话正在制作中 → 不重复开始
  if(_lastIdea===idea&&_lastPid){try{const st=await api(`/api/projects/${enc(_lastPid)}/status`);if(st&&st.running){toast('该想法正在制作中，请等它跑完');return}}catch(e){}}
  const btn=$('btnCreate');const oldTxt=btn.textContent;btn.disabled=true;btn.textContent='开始中…';
  try{
    const r=await post('/api/projects',{idea,name:$('name').value.trim()});
    _lastIdea=idea;_lastPid=r.id;
    await refreshList();openProject(r.id);
    await api(`/api/projects/${enc(r.id)}/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({no_media:$('noMedia').checked})});
    startLive(r.id);
    toast('✅ 已开始制作：'+(r.name||r.id));
    $('idea').value='';$('name').value='';   // 成功后清空输入
  }catch(e){toast('开始失败：'+e.message)}
  btn.disabled=false;btn.textContent=oldTxt;
};
async function runProject(id,noMedia=false){try{await api(`/api/projects/${enc(id)}/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({no_media:noMedia})});startLive(id)}catch(e){alert('启动失败：'+e.message)}}
$('btnRun').onclick=()=>currentId&&runProject(currentId);
async function delProject(id,name){if(!confirm(`删除「${name}」？`))return;await api(`/api/projects/${enc(id)}`,{method:'DELETE'});if(currentId===id){currentId=null;$('board').innerHTML='';$('emptyHint').style.display='flex';$('hBadge').textContent='未选项目'}refreshList()}
async function openProject(id){currentId=id;refreshList();$('emptyHint').style.display='none';
  const [st,arts]=await Promise.all([api(`/api/projects/${enc(id)}/status`),api(`/api/projects/${enc(id)}/artifacts`)]);renderProject(id,st,arts);if(st.running)startLive(id)}

// ── 渲染画布卡片 ──
function renderProject(id,st,arts){
  lastArts=arts;const m=st.media||{},tot=m.videos_total||0,done=m.videos_completed||0;
  // 按逻辑关系排序：文本按流水线阶段，资产图按 角色→场景→道具
  arts.texts=[...arts.texts].sort((a,b)=>STAGE_ORDER.indexOf(a.agent)-STAGE_ORDER.indexOf(b.agent));
  arts.images=[...arts.images].sort((a,b)=>catRank(a)-catRank(b));
  const p=(window.__plist||[]).find(x=>x.id===id);const b=$('hBadge');
  if(st.running){b.className='badge run';b.textContent=(p&&p.name||'')+' · '+(st.current_stage||'运行中')}
  else if(tot&&done<tot){b.className='badge run';b.textContent=(p&&p.name||'')+' · 制作中 '+done+'/'+tot}
  else if(arts.final){b.className='badge ok';b.textContent=(p&&p.name||'')+' · 已完成'}
  else{b.className='badge none';b.textContent=(p&&p.name||'')+' · '+(st.error?('失败'):'空闲')}
  $('runInfo').textContent=st.running?`${done}/${tot||'?'} 镜头 · ${m.images||0}/${m.images_total||'?'} 图`:'';
  // 画布顶部实时进度条
  const lb=$('liveBar');
  if(st.running){lb.classList.remove('hide');$('lbStage').textContent='🔄 运行中 · '+(STAGE_CN[st.current_stage]||st.current_stage||'');$('lbCount').textContent=tot?`镜头 ${done}/${tot} · 图 ${m.images||0}/${m.images_total||'?'}`:`图 ${m.images||0}/${m.images_total||'?'} · 文本 ${arts.texts.length}`;$('lbFill').style.width=(tot?Math.round(done/Math.max(tot,1)*100):(st.current_stage?45:8))+'%'}
  else lb.classList.add('hide');
  // 清空卡片（保留 SVG 连线层）
  const board=$('board');board.querySelectorAll('.n').forEach(n=>n.remove());
  if(arts.final)addCard('film','🏆 最终成片','film',`<video src="${arts.final}" controls></video>`);
  arts.videos.forEach((v,i)=>addCard('v'+i,'🎬 镜头 '+v.id,'v',`${v.url?`<video src="${v.url}" controls></video>`:`<div class="muted">${v.status||'未生成'}</div>`}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px"><span class="tag">${v.id} · ${v.status||''}</span><span style="display:flex;gap:4px">
    ${/fail|error|timeout/i.test(v.status||'')?`<button class="ghost small" onclick="reroll('${id}','${v.id}',true)">✨柔化</button>`:''}
    <button class="ghost small" onclick="reroll('${id}','${v.id}',false)">↻</button></span></div>`));
  arts.images.forEach((im,i)=>addCard('i'+i,'🖼 '+cnImg(im.name),'i',`<img src="${im.url}" loading="lazy" onclick="window.open('${im.url}')"/>`));
  arts.texts.forEach((t,i)=>{const label=cnAgent(t.agent)+' · '+cnDoc(t.file);addCard('t'+i,'📝 '+label,'t',`<button class="ghost small" style="width:100%" onclick="viewText('${t.url}','${label}')">📄 查看全文</button>`)});
  buildLinks(arts);arrange();
}
function previewText(t){return ('（点击查看全文）');}

// ── 逻辑连线 ──
function buildLinks(arts){
  const links=[];
  const stageOrder=['screenwriter','dialogue_expert','art_director','cinematographer','storyboarder','asset_builder','video_renderer','sound_designer','post_editor','qa_reviewer','director'];
  const textUid={};arts.texts.forEach((t,i)=>{textUid[t.agent]='t'+i});
  // 文本阶段链：剧本 → 台词 → 美术 → … → 质控
  const chain=stageOrder.map(a=>textUid[a]).filter(Boolean);
  for(let i=1;i<chain.length;i++)links.push({from:chain[i-1],to:chain[i]});
  // 资产方案 → 各资产图
  if(textUid['asset_builder'])arts.images.forEach((im,i)=>links.push({from:textUid['asset_builder'],to:'i'+i}));
  // 各镜头视频 → 成片
  if(arts.final)arts.videos.forEach((v,i)=>links.push({from:'v'+i,to:'film'}));
  window.__links=links;
}
function drawLines(){
  const svg=$('links');if(!svg)return;svg.innerHTML='';
  const map={};$('board').querySelectorAll('.n').forEach(c=>map[c.dataset.uid]=c);
  (window.__links||[]).forEach(l=>{
    const a=map[l.from],b=map[l.to];if(!a||!b)return;
    const pa=cardPos[l.from]||{x:0,y:0},pb=cardPos[l.to]||{x:0,y:0};
    const x1=pa.x+a.offsetWidth,y1=pa.y+a.offsetHeight/2,x2=pb.x,y2=pb.y+b.offsetHeight/2;
    const dx=Math.max(36,Math.abs(x2-x1)/2);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
    p.setAttribute('fill','none');p.setAttribute('stroke','#c9751c');p.setAttribute('stroke-width','2');p.setAttribute('opacity','0.7');
    svg.appendChild(p);
  });
}

// 卡片统一尺寸（按类型），保证网格整齐
const SIZE={film:{w:360,h:300},v:{w:290,h:250},i:{w:180,h:200},t:{w:220,h:120}};
let cardPos={};
function addCard(uid,title,kind,html){
  if(cardPos[uid]===undefined)cardPos[uid]={x:0,y:0};
  const s=SIZE[kind]||SIZE.t;
  const el=document.createElement('div');el.className='n '+(kind==='film'?'film':'');el.dataset.uid=uid;el.dataset.kind=kind;
  el.style.width=s.w+'px';el.style.height=s.h+'px';
  el.style.left=cardPos[uid].x+'px';el.style.top=cardPos[uid].y+'px';
  el.innerHTML=`<div class="chead"><span>${title}</span><span style="color:var(--muted);font-weight:400">⋮⋮</span></div><div class="cbody">${html}</div>`;
  $('board').appendChild(el);makeDrag(el);
}
function makeDrag(el){
  const head=el.querySelector('.chead');let sx,sy,ox,oy,drag=false;
  head.addEventListener('pointerdown',e=>{drag=true;head.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=cardPos[el.dataset.uid].x;oy=cardPos[el.dataset.uid].y;e.stopPropagation()});
  head.addEventListener('pointermove',e=>{if(!drag)return;cardPos[el.dataset.uid].x=ox+(e.clientX-sx)/zoom;cardPos[el.dataset.uid].y=oy+(e.clientY-sy)/zoom;el.style.left=cardPos[el.dataset.uid].x+'px';el.style.top=cardPos[el.dataset.uid].y+'px';drawLines()});
  head.addEventListener('pointerup',()=>drag=false);head.addEventListener('pointercancel',()=>drag=false);
}
function arrange(){
  const cards=[...$('board').querySelectorAll('.n')];
  const by=k=>cards.filter(c=>c.dataset.kind===k);
  const gap=16,zy=72;   // 卡片区从 y=72 开始，上方留给横向区块标题
  gridPlace(by('t'),20,zy,1,SIZE.t.w+gap,SIZE.t.h+gap);
  const bX=20+SIZE.t.w+60;        gridPlace(by('i'),bX,zy,3,SIZE.i.w+gap,SIZE.i.h+gap);
  const cX=bX+3*(SIZE.i.w+gap)+60;gridPlace(by('v'),cX,zy,3,SIZE.v.w+gap,SIZE.v.h+gap);
  const dX=cX+3*(SIZE.v.w+gap)+60;gridPlace(by('film'),dX,zy,1,SIZE.film.w+gap,SIZE.film.h+gap);
  placeLabels([{x:20,t:'📝 剧本与方案',w:SIZE.t.w},{x:bX,t:'🖼 资产图',w:3*(SIZE.i.w+gap)-gap},{x:cX,t:'🎬 镜头视频',w:3*(SIZE.v.w+gap)-gap},{x:dX,t:'🏆 成片',w:SIZE.film.w}]);
  requestAnimationFrame(drawLines);setTimeout(drawLines,600);
}
function gridPlace(list,x,y,cols,cw,ch){list.forEach((c,i)=>{cardPos[c.dataset.uid]={x:x+(i%cols)*cw,y:y+Math.floor(i/cols)*ch};placeCard(c)})}
function placeLabels(zs){$('board').querySelectorAll('.zone').forEach(z=>z.remove());zs.forEach(z=>{const d=document.createElement('div');d.className='zone';d.style.left=z.x+'px';d.style.top='26px';if(z.w)d.style.width=z.w+'px';d.textContent=z.t;$('board').appendChild(d)})}
function placeCard(c){c.style.left=cardPos[c.dataset.uid].x+'px';c.style.top=cardPos[c.dataset.uid].y+'px'}

// ── 平移 / 缩放 ──
const vp=$('viewport');let panDrag=false,psx,psy,pox,poy;
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.n')||e.target.closest('.toolbar')||e.target.closest('.zoom'))return;panDrag=true;vp.classList.add('panning');psx=e.clientX;psy=e.clientY;pox=panX;poy=panY;vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!panDrag)return;panX=pox+(e.clientX-psx);panY=poy+(e.clientY-psy);applyTransform()});
vp.addEventListener('pointerup',()=>{panDrag=false;vp.classList.remove('panning')});vp.addEventListener('pointercancel',()=>{panDrag=false;vp.classList.remove('panning')});
vp.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;setZoom(zoom*f,e.clientX,e.clientY)},{passive:false});
function setZoom(z,cx,cy){
  if(cx!==undefined){const r=vp.getBoundingClientRect();const bx=(cx-r.left-panX)/zoom,by=(cy-r.top-panY)/zoom;zoom=Math.max(0.25,Math.min(2,z));panX=cx-r.left-bx*zoom;panY=cy-r.top-by*zoom}
  else{zoom=Math.max(0.25,Math.min(2,z));}
  applyTransform();$('zoomVal').textContent=Math.round(zoom*100)+'%';
}
function applyTransform(){$('board').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`}
function resetView(){zoom=0.7;panX=24;panY=24;applyTransform();$('zoomVal').textContent='70%'}

async function viewText(url,title){$('mTitle').textContent=title;$('mBody').textContent=(await(await fetch(url)).text());$('modal').style.display='flex'}
async function reroll(id,shotId,soften){if(!confirm(soften?`柔化重试镜头${shotId}？`:`重生成镜头${shotId}？`))return;
  await api(`/api/projects/${enc(id)}/shots/${enc(shotId)}/regenerate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({soften})});alert('已提交，稍后自动刷新');startLive(id)}

// ── 实时进度 ──
function startLive(id){stopLive();liveTimer=setInterval(async()=>{try{const [st,arts]=await Promise.all([api(`/api/projects/${enc(id)}/status`),api(`/api/projects/${enc(id)}/artifacts`)]);renderProject(id,st,arts);if(!st.running){stopLive();refreshList()}}catch(e){}},4000)}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}}

resetView();(async()=>{await refreshList()})();

// === 增量：制作控制 / Gate Review / 时间线（不修改任何现有函数源码）===
const post=(p,body)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
const escapeHtml=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const STAGES_FLOW=['init','script','dialogue_review','art_direction','shot_design','asset_build','video_render','post_edit','qa_review','final'];
const STAGE_LABELS_CN={init:'初始化',script:'剧本创作',dialogue_review:'台词诊断',art_direction:'美术定调',shot_design:'镜头设计',asset_build:'资产构建',video_render:'视频渲染',post_edit:'后期合成',qa_review:'质控评审',final:'最终交付'};
let drawerOpen=false,tlOpen=false,grCurStage=null,taskTimer=null;

function stopTask(){if(taskTimer){clearInterval(taskTimer);taskTimer=null}}
function setBusy(text){clearBusy();$('drwBody').insertAdjacentHTML('afterbegin',`<div id="busyBar" class="gr-loading"><span class="spin"></span>${text}</div>`)}
function clearBusy(){const b=$('busyBar');if(b)b.remove()}
function pollTask(onDone){ // 轮询 status，期间自动刷新画布/进度条，完成后回调
  stopTask();setBusy('任务进行中…');
  taskTimer=setInterval(async()=>{try{
    const [st,arts]=await Promise.all([api(`/api/projects/${enc(currentId)}/status`),api(`/api/projects/${enc(currentId)}/artifacts`)]);
    renderProject(currentId,st,arts);
    const t=st.task;if(t&&t.done){stopTask();clearBusy();onDone(t);loadPipeline(currentId)}
  }catch(e){}},3000);
}
async function refreshCanvas(pid){try{const [st,arts]=await Promise.all([api(`/api/projects/${enc(pid)}/status`),api(`/api/projects/${enc(pid)}/artifacts`)]);renderProject(pid,st,arts)}catch(e){}}

// ── 制作控制抽屉 ──
function toggleDrawer(open){drawerOpen=open===undefined?!drawerOpen:open;$('drawer').classList.toggle('open',drawerOpen);if(drawerOpen&&currentId)loadPipeline(currentId);if(!drawerOpen)stopTask()}
async function loadPipeline(pid){
  if(!pid){$('drwBody').innerHTML='<div class="muted" style="padding:20px;text-align:center">未选项目</div>';return}
  const p=(window.__plist||[]).find(x=>x.id===pid);$('drwName').textContent=(p&&p.name)||pid;
  let data;try{data=await api(`/api/projects/${enc(pid)}/pipeline`)}catch(e){$('drwBody').innerHTML='<div class="muted" style="padding:14px">加载失败：'+escapeHtml(e.message)+'</div>';return}
  const curIdx=STAGES_FLOW.indexOf(data.current_stage);
  const rows=data.stages.map(s=>{const idx=STAGES_FLOW.indexOf(s.stage);
    let pill=s.is_current?'<span class="pill cur">当前</span>':(curIdx>=0&&idx>=0&&idx<curIdx?'<span class="pill done">✓</span>':'<span class="pill">待做</span>');
    const dots=s.agents.map(a=>`<span class="dot ${a.status==='done'?'done':a.status==='working'?'working':a.status==='error'?'error':''}" title="${escapeHtml(a.name)}：${a.status}"></span>`).join('');
    const ops=`<button class="ghost small" onclick="stageReview('${s.stage}')">🔍审查</button><button class="ghost small" onclick="stageRun('${s.stage}')">▶执行</button><button class="ghost small" onclick="stageApprove('${s.stage}')">✓批准</button>`;
    return `<div class="stg ${s.is_current?'cur':''}"><div class="stitle">${s.label}${pill}<span class="stag-dots">${dots}</span></div><div class="sops">${ops}</div></div>`}).join('');
  $('drwBody').innerHTML=rows+`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="ghost small" onclick="stageRollback()">↩ 回退</button><button class="ghost small" onclick="continueVideos()">🎬 继续生成视频</button></div>`;
}
async function stageRun(stage){if(!currentId)return;try{await post(`/api/projects/${enc(currentId)}/stages/${enc(stage)}/run`);pollTask(t=>{const r=t.result||{};if(r.errors&&r.errors.length)alert('阶段已执行，但有 '+(r.errors.length)+' 个 Agent 报错');refreshCanvas(currentId)})}catch(e){alert(e.message)}}
async function stageReview(stage){if(!currentId)return;try{await post(`/api/projects/${enc(currentId)}/stages/${enc(stage)}/gate-review`);grCurStage=stage;showGrLoading(stage);pollTask(t=>{if(t.error){$('grBody').innerHTML='<div class="gr-verdict fail">审查失败：'+escapeHtml(t.error)+'</div>';$('grFoot').style.display='none';return}showGateReview(t.result)})}catch(e){alert(e.message)}}
async function stageApprove(stage){if(!currentId)return;try{await post(`/api/projects/${enc(currentId)}/stages/${enc(stage)}/approve`)}catch(e){alert(e.message);return}loadPipeline(currentId)}
async function stageRollback(){if(!currentId)return;if(!confirm('回退到上一阶段？'))return;try{await post(`/api/projects/${enc(currentId)}/rollback`);refreshCanvas(currentId)}catch(e){alert(e.message);return}loadPipeline(currentId)}
async function continueVideos(){
  if(!currentId)return;
  if(!confirm('确认继续生成视频？\n· 跳过已完成镜头，只补齐剩余\n· 卡住的镜头约6分钟自动跳过\n· 完成后自动拼接成片'))return;
  try{
    await post(`/api/projects/${enc(currentId)}/video_render/continue`);
    toast('✅ 已开始补齐视频，进行中…');
    pollTask(t=>{
      if(t.error){toast('❌ 任务出错停止：'+t.error);refreshCanvas(currentId);return}
      const r=t.result||{},c=r.completed||0,tt=r.total||0;
      if(r.error)toast('⚠️ 已停止：'+r.error);
      else if(c>=tt)toast('✅ 视频全部完成：'+c+'/'+tt+' 镜头，成片已更新');
      else toast('⚠️ 完成，'+(tt-c)+' 个镜头卡住已跳过：'+c+'/'+tt);
      refreshCanvas(currentId);
    })
  }catch(e){toast('❌ 开始失败：'+e.message)}
}

// ── Gate Review 弹窗 ──
function showGrLoading(stage){$('grTitle').textContent='Gate Review · '+(STAGE_LABELS_CN[stage]||stage);$('grFoot').style.display='none';$('grBody').innerHTML='<div class="gr-loading"><span class="spin"></span>正在请质控评审与总导演审查，请稍候…</div>';$('grModal').classList.add('show')}
function renderDiff(d){if(!d||d.error)return '<div class="muted" style="font-size:11px">'+((d&&d.error)||'暂无版本对比（首次生成）')+'</div>';const ls=String(d.diff||'').split('\n');return '<div class="gr-diff">'+ls.map(l=>{const e=escapeHtml(l);if(l.startsWith('+')&&!l.startsWith('+++'))return '<div class="plus">'+e+'</div>';if(l.startsWith('-')&&!l.startsWith('---'))return '<div class="minus">'+e+'</div>';if(l.startsWith('@@'))return '<div class="meta">'+e+'</div>';return '<div>'+e+'</div>'}).join('')+'</div>'}
function showGateReview(d){if(!d){$('grBody').innerHTML='<div class="gr-verdict fail">未取到审查结果</div>';return}
  const pass=d.passed;
  let h='<div class="gr-verdict '+(pass?'pass':'fail')+'">'+(pass?'✓ 审查通过':'↻ 建议修改')+' · 决策：'+(d.decision||'-')+'</div>';
  if(d.issues&&d.issues.length)h+='<div class="gr-sec"><h4>发现的问题</h4><div class="gr-issues">'+d.issues.map(i=>'• '+escapeHtml(typeof i==='string'?i:JSON.stringify(i))).join('<br>')+'</div></div>';
  if(d.reviewer_output)h+='<div class="gr-sec"><h4>质控评审意见</h4><details><summary class="muted" style="cursor:pointer;font-size:11px">展开查看</summary><div class="gr-out">'+escapeHtml(d.reviewer_output)+'</div></details></div>';
  if(d.director_output)h+='<div class="gr-sec"><h4>总导演意见</h4><details><summary class="muted" style="cursor:pointer;font-size:11px">展开查看</summary><div class="gr-out">'+escapeHtml(d.director_output)+'</div></details></div>';
  if(d.comparisons&&d.comparisons.length)h+=d.comparisons.map(c=>'<div class="gr-sec"><h4>'+(CN_AGENT[c.role]||c.role)+' · '+escapeHtml(c.file)+'</h4>'+renderDiff(c.diff)+'</div>').join('');
  $('grBody').innerHTML=h;$('grFoot').style.display='flex';$('grModal').classList.add('show')}
function closeGR(){$('grModal').classList.remove('show')}
async function grDoApprove(){if(!currentId||!grCurStage)return;try{await post(`/api/projects/${enc(currentId)}/stages/${enc(grCurStage)}/approve`)}catch(e){alert(e.message);return}closeGR();loadPipeline(currentId)}
async function grDoReject(){if(!currentId)return;const reason=$('grReason').value.trim();try{await post(`/api/projects/${enc(currentId)}/rollback`,{stage:grCurStage,reason})}catch(e){alert(e.message);return}closeGR();loadPipeline(currentId);refreshCanvas(currentId)}

// ── 底部镜头时间线 ──
function renderTimeline(arts){if(!arts)return;const items=[...(arts.images||[]).map(im=>({type:'img',url:im.url,cap:cnImg(im.name)})),...(arts.videos||[]).map(v=>({type:'vid',url:v.url,cap:'镜头 '+v.id,status:v.status}))];$('tlCount').textContent=items.length?('('+items.length+')'):'';
  if(!items.length){$('tlStrip').innerHTML='<div class="muted" style="padding:10px;font-size:11px">暂无媒体</div>';return}
  $('tlStrip').innerHTML=items.map((it,i)=>`<div class="tl-item" onclick="openLightbox('${it.type}','${it.url||''}')"><div class="tl-thumb"><span class="tl-idx">${i+1}</span>${it.type==='img'?`<img src="${it.url}" loading="lazy"/>`:(it.url?`<video src="${it.url}" muted preload="metadata"></video>`:`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:9px;color:var(--muted)">${escapeHtml(it.status||'未生成')}</div>`)}</div><div class="tl-cap">${escapeHtml(it.cap||'')}</div></div>`).join('')}
function toggleTimeline(){tlOpen=!tlOpen;$('timeline').classList.toggle('open',tlOpen);$('tlToggle').textContent=tlOpen?'收起 ▼':'展开 ▲'}
function openLightbox(type,url){if(!url)return;$('lbContent').innerHTML=type==='vid'?`<video src="${url}" controls autoplay></video>`:`<img src="${url}"/>`;$('lightbox').classList.add('show')}
function closeLightbox(){$('lightbox').classList.remove('show');$('lbContent').innerHTML=''}

// 绑定 + 包装现有 renderProject（同步时间线，不改其源码）
$('btnMfg').onclick=()=>toggleDrawer();
$('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox'||e.target.classList.contains('x'))closeLightbox()});
(function(){const _orig=renderProject;window.renderProject=function(id,st,arts){const r=_orig.apply(this,arguments);try{renderTimeline(arts)}catch(e){}return r}})();
</script>
